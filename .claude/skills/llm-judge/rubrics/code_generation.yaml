# Code Generation Evaluation Rubric
# For evaluating AI-generated code

name: code_generation
version: "1.0"
description: Comprehensive rubric for evaluating generated code

dimensions:
  correctness:
    weight: 0.40
    description: "Does the code produce correct output for the given requirements?"
    scale:
      5: "Fully correct; handles all specified cases including edge cases"
      4: "Correct for main cases; minor edge case issues"
      3: "Works for basic cases; fails on some important scenarios"
      2: "Partially works; significant logical errors"
      1: "Does not work; crashes or produces wrong output"
    verification: |
      Run test cases when possible:
      - Happy path tests
      - Edge cases
      - Error conditions

  code_quality:
    weight: 0.20
    description: "Readability, organization, and maintainability"
    scale:
      5: "Excellent: clear naming, proper structure, follows language idioms"
      4: "Good: readable with minor style inconsistencies"
      3: "Acceptable: functional but could be cleaner"
      2: "Poor: hard to read, inconsistent style, poor organization"
      1: "Bad: incomprehensible structure, misleading names"

  efficiency:
    weight: 0.15
    description: "Time and space complexity; performance characteristics"
    scale:
      5: "Optimal or near-optimal solution for the problem"
      4: "Efficient; reasonable complexity for the use case"
      3: "Acceptable; some inefficiencies but won't cause issues at expected scale"
      2: "Inefficient; may cause problems at moderate scale"
      1: "Very inefficient; O(n²) or worse when O(n) is possible"

  security:
    weight: 0.15
    description: "Security best practices and vulnerability avoidance"
    scale:
      5: "Secure: proper input validation, no injection risks, follows OWASP guidelines"
      4: "Mostly secure: minor issues, defense in depth present"
      3: "Acceptable: no critical vulnerabilities but room for improvement"
      2: "Concerning: potential vulnerabilities present"
      1: "Insecure: obvious vulnerabilities (SQL injection, XSS, etc.)"
    red_flags:
      - "String concatenation for SQL queries"
      - "eval() or exec() on user input"
      - "Hardcoded secrets or credentials"
      - "Missing input validation"
      - "Improper error handling exposing internals"

  completeness:
    weight: 0.10
    description: "Does the code address all requirements?"
    scale:
      5: "All requirements addressed with appropriate error handling"
      4: "Main requirements complete; minor features missing"
      3: "Core functionality present; notable gaps"
      2: "Incomplete; missing important functionality"
      1: "Stub or placeholder; doesn't implement the request"

# Language-specific considerations
language_specific:
  python:
    - "Use of type hints (modern Python)"
    - "Proper exception handling"
    - "Following PEP 8 style"
    - "Using pythonic idioms"

  javascript:
    - "Proper async/await usage"
    - "No var (use const/let)"
    - "Error handling in promises"
    - "TypeScript types if applicable"

  sql:
    - "Parameterized queries (never string concat)"
    - "Proper indexing considerations"
    - "Avoiding N+1 queries"

# Test case guidance
testing_guidance: |
  When possible, verify code by:
  1. Static analysis (linting, type checking)
  2. Unit test execution
  3. Manual inspection of logic flow

  For code that can't be executed:
  - Trace through logic manually
  - Check for common bugs (off-by-one, null handling)
  - Verify algorithm correctness

# Thresholds
thresholds:
  production_ready: 4.0
  needs_review: 3.0
  reject: 2.0
  security_minimum: 3  # Security dimension must be >= 3

# Special rules
special_rules:
  - name: "security_veto"
    description: "If security score is 1 or 2, overall score cannot exceed 2"
  - name: "correctness_floor"
    description: "If correctness is 1, overall score is 1 regardless of other dimensions"
